name: Attach Windows Installer
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix'
        required: true
        type: string
      sha256:
        description: 'Expected installer SHA-256'
        required: true
        type: string
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Assemble and attach installer
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{64}$ ]]
          base="Total-Telemetry-$VERSION"
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          for part in 001 002; do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/windows-v$VERSION/$base.zip.$part" \
              --output "$base.zip.$part"
          done
          cat "$base.zip.001" "$base.zip.002" > "$base.zip"
          unzip -p "$base.zip" "$base-Setup.exe" > "$base-Setup.exe"
          printf '%s  %s\n' "$EXPECTED_SHA" "$base-Setup.exe" | sha256sum --check
          gh release upload "v$VERSION" "$base-Setup.exe" --repo "$GITHUB_REPOSITORY"
